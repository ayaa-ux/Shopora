server:
  port: 8084

spring:
  application:
    name: ai-assistant-service

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

ai:
  chat:
    api-key: ${AI_API_KEY}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
    model-name: ${AI_MODEL:openai/gpt-oss-120b}

  vector-store:
    host: localhost
    port: 5432
    database: shopora_ai
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: docker
ai:
  vector-store:
    host: postgres-db