services:

  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: shopora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER}
    ports:
      - "5432:5432"
    volumes:
      - shopora_pg_data:/var/lib/postgresql/data
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - shopora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: shopora-auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - shopora-network

  catalog-service:
    build:
      context: ./catalog-service
    container_name: shopora-catalog-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AI_SERVICE_URL: http://ai-assistant-service:8084
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-shopora-internal-dev-key}
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - shopora-network

  groupbuying-service:
    build:
      context: ./groupbuying-service
    container_name: shopora-groupbuying-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - shopora-network

  ai-assistant-service:
    build:
      context: ./ai-assistant-service
    container_name: shopora-ai-assistant-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-shopora-internal-dev-key}
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - shopora-network

  order-service:
    build:
      context: ./order-service
    container_name: shopora-order-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8085:8085"
    networks:
      - shopora-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: shopora-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      groupbuying-service:
        condition: service_started
      ai-assistant-service:
        condition: service_started
      order-service:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - shopora-network

networks:
  shopora-network:
    driver: bridge

volumes:
  shopora_pg_data: