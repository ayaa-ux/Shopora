server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Empêche un client externe d'usurper l'appel interne catalog -> ai
      default-filters:
        - RemoveRequestHeader=X-Internal-Key

      routes:
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: catalog-products-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**

        - id: catalog-offers-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/offers/**

        - id: groupbuying-sessions-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/sessions/**

        - id: groupbuying-participations-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/participations/**

        - id: groupbuying-websocket-route
          uri: ws://localhost:8083
          predicates:
            - Path=/ws-groupbuying/**

        - id: order-service-route
          uri: http://localhost:8085
          predicates:
            - Path=/api/orders/**

        - id: ai-assistant-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/assistant/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

---
# Profil "docker" : les URI localhost deviennent des noms de services Docker.
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**

        - id: catalog-products-route
          uri: http://catalog-service:8082
          predicates:
            - Path=/api/products/**

        - id: catalog-offers-route
          uri: http://catalog-service:8082
          predicates:
            - Path=/api/offers/**

        - id: groupbuying-sessions-route
          uri: http://groupbuying-service:8083
          predicates:
            - Path=/api/sessions/**

        - id: groupbuying-participations-route
          uri: http://groupbuying-service:8083
          predicates:
            - Path=/api/participations/**

        - id: groupbuying-websocket-route
          uri: ws://groupbuying-service:8083
          predicates:
            - Path=/ws-groupbuying/**

        - id: order-service-route
          uri: http://order-service:8085
          predicates:
            - Path=/api/orders/**

        - id: ai-assistant-route
          uri: http://ai-assistant-service:8084
          predicates:
            - Path=/api/assistant/**